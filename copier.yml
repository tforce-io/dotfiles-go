_min_copier_version: "9.0.0"

_exclude:
  - ".DS_Store"
  - ".git"
  - ".hg"
  - ".svn"
  - "~*"
  - "*.py[co]"
  - "__pycache__"
  - "LICENSE"
  - "README.md"
  - "copier.yml"
  - "copier.yaml"
  - "licenses"
  - |
      {% if license == 'None' %}
      LICENSE
      COPYING
      COPYING.LESSER
      .agents/license-header.md
      {% elif license == 'MIT' or license == 'BSD-2-Clause' or license == 'BSD-3-Clause' or license == 'Apache-2.0' %}
      COPYING
      COPYING.LESSER
      {% elif license == 'GPL-3.0' or license == 'AGPL-3.0' %}
      LICENSE
      COPYING.LESSER
      {% elif license == 'LGPL-3.0' %}
      LICENSE
      {% endif %}
      {% if license_header is defined and license_header == 'None' %}
      .agents/license-header.md
      {% endif %}


_message_after_update: |
  Update finished. If any file contains conflict markers (<<<<<<< / >>>>>>>)
  or Copier generated *.rej files, resolve them before committing.
  Then review the changes and commit them.

project_name:
  type: str
  help: "What is the name of this project?"
  default: "go-project"
  validator: >-
    {% if not (project_name | regex_search('^[A-Za-z][A-Za-z0-9_. -]*$')) %}
    Start with a letter; use only letters, digits, spaces, dots, dashes, and underscores.
    {% endif %}

license:
  type: str
  help: "Which open source license do you want to use?"
  choices:
    - None
    - MIT
    - BSD-2-Clause
    - BSD-3-Clause
    - Apache-2.0
    - GPL-3.0
    - LGPL-3.0
    - AGPL-3.0
  default: None

copyright_holder:
  type: str
  help: "Who is the copyright holder (person or organization)?"
  when: "{{ license != 'None' }}"

copyright_year:
  type: int
  help: "What year should be used in the copyright notice?"
  when: "{{ license != 'None' }}"
  default: 2025

license_header:
  type: str
  help: "Which license header style should be used in code files?"
  choices:
    - Full
    - SPDX
    - None
  default: Full
  when: "{{ license != 'None' }}"
